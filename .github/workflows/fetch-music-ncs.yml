name: fetch-music-ncs
# NCS tracks: push music-requests-ncs/<new>.txt (one search term or ncs.io track URL per line)
on:
  push:
    paths: ['music-requests-ncs/*.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          shopt -s nullglob
          for f in music-requests-ncs/*.txt; do python3 scripts/ncs_fetch.py "$f"; git rm -q "$f"; done
      - name: Commit
        run: |
          git config user.name "Vice City Drops bot"
          git config user.email "jaxtechnology-alt@users.noreply.github.com"
          git add -A
          git commit -m "Add NCS music" || echo "nothing new"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
