name: reachability-test
on:
  push:
    paths: ['.github/workflows/reachability.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check which footage sources a GitHub runner can reach
        run: |
          for u in https://www.pexels.com/ https://videos.pexels.com/ https://pixabay.com/ https://cdn.pixabay.com/ https://storage.googleapis.com/ https://assets.vidiq.com/ https://upload.wikimedia.org/; do
            echo "$u -> $(curl -s -o /dev/null -m 15 -w '%{http_code}' $u)"
          done
          ffmpeg -version | head -1 || echo "no ffmpeg"
